<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562.5" width="1000" height="562.5">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140a"/>
      <stop offset="50%" stop-color="#052e1a"/>
      <stop offset="100%" stop-color="#010c05"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="562.5" fill="url(#hudBg)"/>

  <!-- Tactical Grid -->
  <pattern id="hudGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ffaa" stroke-width="0.6" stroke-opacity="0.15"/>
  </pattern>
  <rect width="1000" height="562.5" fill="url(#hudGrid)"/>

  <!-- Outer HUD Frame -->
  <path d="M 60 40 L 320 40 L 350 65 L 650 65 L 680 40 L 940 40 Q 960 40 960 60 L 960 502 Q 960 522 940 522 L 60 522 Q 40 522 40 502 L 40 60 Q 40 40 60 40 Z" fill="none" stroke="#00ffaa" stroke-width="3" filter="url(#glowGreen)" stroke-opacity="0.85"/>

  <!-- Inner HUD Corner Accents -->
  <path d="M 60 90 L 60 60 L 90 60" fill="none" stroke="#00ffaa" stroke-width="4" filter="url(#glowGreen)"/>
  <path d="M 940 90 L 940 60 L 910 60" fill="none" stroke="#00ffaa" stroke-width="4" filter="url(#glowGreen)"/>
  <path d="M 60 472 L 60 502 L 90 502" fill="none" stroke="#00ffaa" stroke-width="4" filter="url(#glowGreen)"/>
  <path d="M 940 472 L 940 502 L 910 502" fill="none" stroke="#00ffaa" stroke-width="4" filter="url(#glowGreen)"/>

  <!-- Target Reticle Rings -->
  <circle cx="500" cy="281" r="160" fill="none" stroke="#00ffaa" stroke-width="1.5" stroke-dasharray="10 8" stroke-opacity="0.35"/>
  <circle cx="500" cy="281" r="110" fill="none" stroke="#00ffaa" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="500" cy="281" r="10" fill="#00ffaa" filter="url(#glowGreen)"/>
  <line x1="500" y1="80" x2="500" y2="480" stroke="#00ffaa" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="100" y1="281" x2="900" y2="281" stroke="#00ffaa" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner Telemetry Text (Extra Bold & Clear) -->
  <text x="80" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#00ffaa">SPD: 350 KM/H</text>
  <text x="80" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#00ffaa" opacity="0.7">CRS: 275° NW</text>
  
  <text x="80" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#00ffaa">ALT: 980 M</text>
  <text x="80" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#00ffaa">FUEL: 75%</text>

  <text x="920" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#00ffaa" text-anchor="end">15:45:00</text>
  <text x="920" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#00ffaa" opacity="0.7" text-anchor="end">2047-08-15</text>
  
  <text x="920" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#00ffaa" text-anchor="end">THRUST: 88%</text>
  <text x="920" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#00ffaa" text-anchor="end">SYS: NOMINAL</text>

  <!-- Main Title & Subtitle (Crystal Clear) -->
  <text x="500" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#00ffcc" text-anchor="middle" letter-spacing="4" filter="url(#glowGreen)">TRINETRA-TACTICAL</text>
  <text x="500" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#00ffaa" text-anchor="middle" letter-spacing="2">NEXT-GEN PASSIVE BORDER SURVEILLANCE SYSTEM</text>

  <!-- Innovation Mission Red Box Badge -->
  <rect x="250" y="340" width="500" height="55" fill="rgba(255, 30, 60, 0.22)" stroke="#ff2a55" stroke-width="2.5" filter="url(#glowRed)" rx="8"/>
  <text x="500" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ff4d6d" text-anchor="middle" letter-spacing="3" filter="url(#glowRed)">INNOVATION MISSION - BHARAT 2047</text>
</svg>
